version: '3.8'

services:
  radly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radly
    ports:
      - "5000:5000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_do_not_use_in_prod_key_32b}
      - LOG_LEVEL=INFO
      - PORT=5000
    restart: unless-stopped
