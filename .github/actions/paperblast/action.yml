name: "PaperBlast Research Impact Analysis"
description: "Identifies changed commit, triggers PaperBlast API, and waits for evidence-backed findings."
inputs:
  api_url:
    description: "URL of the PaperBlast API"
    required: true
    default: "https://api.paperblast.io/api"
  github_token:
    description: "GitHub Token for posting PR comments"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: pip install httpx
      shell: bash

    - name: Run PaperBlast Analysis
      env:
        PAPERBLAST_API_URL: ${{ inputs.api_url }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        python -c "
        import os, time, sys, httpx
        api = os.environ['PAPERBLAST_API_URL']
        sha = os.environ['GITHUB_SHA']
        print(f'Triggering PaperBlast for {sha}...')
        
        # Trigger Analysis Job
        try:
            r = httpx.post(f'{api}/jobs/analyze', json={'files': [], 'paper': {}, 'changeQuery': sha})
            r.raise_for_status()
            job_id = r.json()['jobId']
            print(f'Job Queued: {job_id}')
        except Exception as e:
            print(f'Failed to trigger analysis: {e}')
            sys.exit(1)
            
        # Poll Job Status safely
        status_url = f'{api}/jobs/{job_id}'
        for _ in range(60): # 10 minutes max polling
            resp = httpx.get(status_url)
            if resp.status_code == 200:
                job = resp.json()
                status = job.get('status')
                print(f'Status: {status}')
                if status == 'READY':
                    print('Analysis Complete!')
                    print(job.get('result', {}))
                    sys.exit(0)
                elif status == 'FAILED':
                    print(f'Analysis Failed: {job.get(\"error\")}')
                    sys.exit(1)
            time.sleep(10)
            
        print('Timeout waiting for analysis.')
        sys.exit(1)
        "
      shell: bash
